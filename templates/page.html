{% extends "index.html" %}
{% block main %}
    <article class="post">
        <header>
            <h1>{{ page.title }}</h1>
            <p class="posted-on">Posted on <time datetime="{{ page.date | date(format='%Y-%m-%d') }}">{{ page.date | date(format="%B %-d, %Y") }}</time></p>
        </header>

        {{ page.content | safe }}

    </article>
{% endblock %}
